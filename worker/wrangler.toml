# Cloudflare Worker configuration for Vitamin G AI Proxy
# Source: developers.cloudflare.com/workers/wrangler/configuration/
#
# Deploy:
#   cd worker/
#   npx wrangler login
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler deploy
#
# IMPORTANT: Do NOT add ANTHROPIC_API_KEY here. It must be added via:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Secrets are encrypted at rest in Cloudflare's environment and never appear in files.

name = "vg-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-06-06"

# Per-IP limiter: a real device makes ~2 requests/day (responses are cached
# per-day client-side). 10/min is generous headroom for retries.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

# Global circuit breaker: caps total spend even under distributed abuse.
# Keyed on a constant string. Limit is per Cloudflare location, so worst-case
# global throughput is higher — this is a cost ceiling, not a precise quota.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 100
period = 60

# SHARED_TOKEN is also a secret now (rotated after the original leaked in git):
#   npx wrangler secret put SHARED_TOKEN
# Never commit the token value to this repo.
